name: CI/CD Deploy

on:
  push:
    branches: [master, main]
    paths:
      - "api-server/**"
      - "redis-config/**"
      - ".github/workflows/**"
      - "scripts/**"
      - "docker-compose.prod.yaml"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      cache_key: ${{ steps.generate_cache_key.outputs.cache_key }}
      api_changed: ${{ steps.check_changes.outputs.api_changed }}
      redis_changed: ${{ steps.check_changes.outputs.redis_changed }}
      deploy_type: ${{ steps.check_changes.outputs.deploy_type }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Check which services changed
        id: check_changes
        run: |
          # Check if API server files changed
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E "^(api-server/|docker-compose\.prod\.yaml)"; then
            echo "api_changed=true" >> $GITHUB_OUTPUT
            echo "🔄 API Server changes detected"
          else
            echo "api_changed=false" >> $GITHUB_OUTPUT
            echo "✅ No API Server changes"
          fi

          # Check if Redis configuration changed
          if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E "^(redis-config/|scripts/redis-deploy\.sh)"; then
            echo "redis_changed=true" >> $GITHUB_OUTPUT
            echo "🔄 Redis configuration changes detected"
          else
            echo "redis_changed=false" >> $GITHUB_OUTPUT
            echo "✅ No Redis configuration changes"
          fi

          # Determine deployment type
          API_CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E "^api-server/" >/dev/null && echo "true" || echo "false")
          REDIS_CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E "^(redis-config/|scripts/redis-deploy\.sh)" >/dev/null && echo "true" || echo "false")

          if [[ "$API_CHANGED" == "true" && "$REDIS_CHANGED" == "true" ]]; then
            echo "deploy_type=full" >> $GITHUB_OUTPUT
            echo "📦 Full deployment (API + Redis)"
          elif [[ "$API_CHANGED" == "true" ]]; then
            echo "deploy_type=api" >> $GITHUB_OUTPUT
            echo "🚀 API-only deployment"
          elif [[ "$REDIS_CHANGED" == "true" ]]; then
            echo "deploy_type=redis" >> $GITHUB_OUTPUT
            echo "💾 Redis-only deployment"
          else
            echo "deploy_type=none" >> $GITHUB_OUTPUT
            echo "⏭️ No deployment needed"
          fi

          # Print the changes for debugging
          echo "Changes detected:"
          git diff --name-only ${{ github.event.before }} ${{ github.sha }}

      - name: Generate unique cache keys
        id: generate_cache_key
        run: |
          API_HASH=$(git rev-parse HEAD:api-server 2>/dev/null || echo "nohash")
          REDIS_HASH=$(git rev-parse HEAD:redis-config 2>/dev/null || echo "nohash")
          echo "cache_key=api-${API_HASH}-redis-${REDIS_HASH}" >> $GITHUB_OUTPUT
          echo "Generated cache key: api-${API_HASH}-redis-${REDIS_HASH}"

      - name: Verify required files
        run: |
          # Ensure required directories exist
          mkdir -p api-server/scripts redis-config scripts

          # Check if google_roots.pem exists
          if [ ! -f "api-server/google_roots.pem" ]; then
            echo "Creating placeholder google_roots.pem file"
            echo "# Placeholder Google root certificates" > api-server/google_roots.pem
          fi

          # Check API entrypoint script
          if [ ! -f "api-server/scripts/docker-entrypoint.sh" ]; then
            echo "Creating placeholder docker-entrypoint.sh file"
            cat > api-server/scripts/docker-entrypoint.sh << 'ENDOFFILE'
          #!/bin/sh
          exec "$@"
          ENDOFFILE
            chmod +x api-server/scripts/docker-entrypoint.sh
          fi

  test_api:
    needs: prepare
    if: ${{ needs.prepare.outputs.api_changed == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        ports:
          - 5434:5432
        env:
          POSTGRES_USER: ifeanyidike
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: cenphidb_test
        options: >-
          --health-cmd "pg_isready -U ifeanyidike" 
          --health-interval 10s 
          --health-timeout 5s 
          --health-retries 5
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Create .env.test file
        run: |
          cat > .env.test << 'ENDOFFILE'
          DB_USERNAME=ifeanyidike
          DB_PASSWORD=test_password
          DB_HOST=127.0.0.1
          DB_PORT=5434
          DB_NAME=cenphidb_test
          REDIS_HOST=127.0.0.1
          REDIS_PORT=6379
          REDIS_PASSWORD=
          ENDOFFILE

      - name: Wait for services to be ready
        run: |
          for i in {1..30}; do
            if nc -z localhost 5434 && nc -z localhost 6379; then
              echo "All services are up!"
              exit 0
            fi
            echo "Waiting for services..."
            sleep 2
          done
          echo "Services did not start in time."
          exit 1

      - name: Set up Go for API Server
        uses: actions/setup-go@v2
        with:
          go-version: "1.23.1"

      - name: Test API Server
        run: |
          cd api-server
          go test ./...

  build_api:
    needs: [prepare, test_api]
    if: ${{ needs.prepare.outputs.api_changed == 'true' && (needs.test_api.result == 'success' || needs.test_api.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Verify critical files for API Server
        run: |
          mkdir -p api-server/scripts

          if [ ! -f "api-server/google_roots.pem" ]; then
            echo "# Placeholder Google root certificates file" > api-server/google_roots.pem
          fi

          if [ ! -f "api-server/scripts/docker-entrypoint.sh" ]; then
            echo "#!/bin/sh" > api-server/scripts/docker-entrypoint.sh
            echo "exec \"\$@\"" >> api-server/scripts/docker-entrypoint.sh
            chmod +x api-server/scripts/docker-entrypoint.sh
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v4
        with:
          context: ./api-server
          file: ./api-server/Dockerfile
          push: true
          tags: |
            lorddickson/api-server:latest
            lorddickson/api-server:${{ github.sha }}
          no-cache: true
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            CACHE_BUSTER=${{ github.sha }}

      - name: Verify API Docker image
        run: |
          sleep 10
          docker pull lorddickson/api-server:latest
          docker pull lorddickson/api-server:${{ github.sha }}

          LATEST_ID=$(docker inspect --format='{{.Id}}' lorddickson/api-server:latest)
          SHA_ID=$(docker inspect --format='{{.Id}}' lorddickson/api-server:${{ github.sha }})

          echo "Latest API image ID: $LATEST_ID"
          echo "SHA API image ID: $SHA_ID"

          if [ "$LATEST_ID" = "$SHA_ID" ]; then
            echo "✅ API image verification successful"
          else
            echo "⚠️ Warning: API image tags point to different images"
          fi

  deploy_redis:
    needs: [prepare]
    if: ${{ needs.prepare.outputs.redis_changed == 'true' || needs.prepare.outputs.deploy_type == 'full' }}
    runs-on: ubuntu-latest
    env:
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      REDIS_MAX_MEMORY: ${{ secrets.REDIS_MAX_MEMORY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Upload Redis deployment files
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.REDIS_SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "scripts/redis-deploy.sh"
          target: "/home/opc"
          strip_components: 1
          overwrite: true

      - name: Deploy Redis
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.REDIS_SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: REDIS_PASSWORD,REDIS_MAX_MEMORY
          script: |
            cd /home/opc

            # Make script executable
            chmod +x redis-deploy.sh
            sed -i 's/\r$//' redis-deploy.sh

            # Run Redis deployment with environment variables
            REDIS_PASSWORD="$REDIS_PASSWORD" REDIS_MAX_MEMORY="${REDIS_MAX_MEMORY:-800mb}" ./redis-deploy.sh

            echo "✅ Redis deployment completed!"

  deploy_api:
    needs: [prepare, build_api, deploy_redis]
    if: ${{ needs.prepare.outputs.api_changed == 'true' && (needs.deploy_redis.result == 'success' || needs.deploy_redis.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      REDIS_HOST: ${{ secrets.REDIS_SSH_HOST }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      REDIS_PORT: 6379
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ASSEMBLYAI_API_KEY: ${{ secrets.ASSEMBLYAI_API_KEY }}
      OCI_PRIVATE_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY_CONTENT }}
      OCI_BUCKET: ${{ secrets.OCI_BUCKET }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
      GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
      LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
      LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      FIREBASE_KEY_JSON: ${{ secrets.FIREBASE_KEY_JSON }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Upload Docker Compose files to API Server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.API_SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "./docker-compose.prod.yaml"
          target: "/home/opc/app"
          overwrite: true

      - name: Upload API deploy script
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.API_SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          source: "scripts/api-deploy.sh"
          target: "/home/opc"
          strip_components: 1
          overwrite: true

      - name: SSH Deploy to API Server
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.API_SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          envs: DB_USERNAME,DB_PASSWORD,DB_HOST,DB_PORT,REDIS_HOST,REDIS_PASSWORD,REDIS_PORT,OPENAI_API_KEY,ANTHROPIC_API_KEY,ASSEMBLYAI_API_KEY,OCI_PRIVATE_KEY_CONTENT,OCI_BUCKET,OCI_FINGERPRINT,OCI_NAMESPACE,OCI_REGION,OCI_TENANCY_OCID,OCI_USER_OCID,GOOGLE_DRIVE_CLIENT_ID,GOOGLE_DRIVE_CLIENT_SECRET,LINKEDIN_CLIENT_ID,LINKEDIN_CLIENT_SECRET,BREVO_API_KEY,FIREBASE_KEY_JSON,FIREBASE_PROJECT_ID,GITHUB_SHA
          script: |
            cd /home/opc

            # Fix any potential line ending issues
            sed -i 's/\r$//' api-deploy.sh

            # Make deploy script executable
            chmod +x api-deploy.sh

            # Ensure app directory exists
            mkdir -p /home/opc/app

            # Verify Docker Compose file exists
            if [ ! -f "/home/opc/app/docker-compose.prod.yaml" ]; then
                echo "ERROR: docker-compose.prod.yaml not found in /home/opc/app"
                exit 1
            fi

            # Test Redis connectivity first
            echo "Testing Redis connectivity..."
            if ! nc -zv $REDIS_HOST $REDIS_PORT; then
              echo "ERROR: Cannot connect to Redis at $REDIS_HOST:$REDIS_PORT"
              echo "Please ensure Redis is running and firewall allows connections"
              exit 1
            fi

            # Use specific SHA-tagged image
            docker pull lorddickson/api-server:$GITHUB_SHA || {
              echo "Failed to pull SHA image, falling back to latest"
              docker pull lorddickson/api-server:latest
            }

            # Run deploy script with environment variables
            DB_USERNAME=$DB_USERNAME \
            DB_PASSWORD=$DB_PASSWORD \
            DB_HOST=$DB_HOST \
            DB_PORT=$DB_PORT \
            REDIS_HOST=$REDIS_HOST \
            REDIS_PASSWORD=$REDIS_PASSWORD \
            REDIS_PORT=$REDIS_PORT \
            OPENAI_API_KEY=$OPENAI_API_KEY \
            ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY \
            ASSEMBLYAI_API_KEY=$ASSEMBLYAI_API_KEY \
            OCI_PRIVATE_KEY_CONTENT="$OCI_PRIVATE_KEY_CONTENT" \
            OCI_BUCKET=$OCI_BUCKET \
            OCI_FINGERPRINT=$OCI_FINGERPRINT \
            OCI_NAMESPACE=$OCI_NAMESPACE \
            OCI_REGION=$OCI_REGION \
            OCI_TENANCY_OCID=$OCI_TENANCY_OCID \
            OCI_USER_OCID=$OCI_USER_OCID \
            GOOGLE_DRIVE_CLIENT_ID=$GOOGLE_DRIVE_CLIENT_ID \
            GOOGLE_DRIVE_CLIENT_SECRET=$GOOGLE_DRIVE_CLIENT_SECRET \
            LINKEDIN_CLIENT_ID=$LINKEDIN_CLIENT_ID \
            LINKEDIN_CLIENT_SECRET=$LINKEDIN_CLIENT_SECRET \
            BREVO_API_KEY=$BREVO_API_KEY \
            FIREBASE_KEY_JSON="$FIREBASE_KEY_JSON" \
            FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID \
            GITHUB_SHA=$GITHUB_SHA \
            ./api-deploy.sh

            # Health check
            echo "Performing API health check..."
            MAX_RETRIES=5
            RETRY_COUNT=0

            until [ $RETRY_COUNT -ge $MAX_RETRIES ]
            do
              HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/api/health || echo "failed")
              
              if [ "$HEALTH_STATUS" = "200" ]; then
                echo "✅ API is healthy!"
                break
              fi
              
              RETRY_COUNT=$((RETRY_COUNT+1))
              echo "Health check attempt $RETRY_COUNT failed (status: $HEALTH_STATUS), retrying in 10 seconds..."
              sleep 10
            done

            if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
              echo "❌ API health check failed after $MAX_RETRIES attempts"
              docker logs --tail 50 $(docker ps -a | grep api-server | awk '{print $1}') || echo "Could not get container logs"
              exit 1
            fi

            echo "🎉 API deployment completed successfully!"

  notify_deployment:
    needs: [prepare, deploy_redis, deploy_api]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment Summary
        run: |
          echo "🚀 Deployment Summary for commit ${{ github.sha }}"
          echo "Deploy Type: ${{ needs.prepare.outputs.deploy_type }}"
          echo "API Changed: ${{ needs.prepare.outputs.api_changed }}"
          echo "Redis Changed: ${{ needs.prepare.outputs.redis_changed }}"

          if [[ "${{ needs.deploy_redis.result }}" == "success" ]]; then
            echo "✅ Redis deployment: SUCCESS"
          elif [[ "${{ needs.deploy_redis.result }}" == "skipped" ]]; then
            echo "⏭️ Redis deployment: SKIPPED"
          else
            echo "❌ Redis deployment: FAILED"
          fi

          if [[ "${{ needs.deploy_api.result }}" == "success" ]]; then
            echo "✅ API deployment: SUCCESS"
          elif [[ "${{ needs.deploy_api.result }}" == "skipped" ]]; then
            echo "⏭️ API deployment: SKIPPED"
          else
            echo "❌ API deployment: FAILED"
          fi
