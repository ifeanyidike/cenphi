syntax = "proto3";

package intelligence;
import "google/protobuf/struct.proto";

option go_package = "./pb";

// ============================================================================
// Common Types
// ============================================================================

message BrandContext {
  string about_info = 1;
  repeated string keywords = 2;
  string tone = 3;
  map<string, string> brand_colors = 4;
  repeated string color_slice = 5;
  map<string, string> brand_fonts = 6;
  string logo_url = 7;
  repeated string values = 8;
  string tagline = 9;
  string target_audience = 10;
  string mission_statement = 11;
  string business_model = 12;
  string company_size = 13;
  map<string, string> extracted_data = 14;
}

message MediaOpt {
  string testimonial_id = 1;
  string media_url = 2;
}

// ============================================================================
// Emotion Analysis Service
// ============================================================================

service EmotionAnalysisService {
  rpc AnalyzeEmotion(EmotionRequest) returns (EmotionResponse);
}

message EmotionRequest {
  string testimonial_id = 1;
  string media_url = 2;
  repeated string target_emotions = 3;
  string analysis_depth = 4; // "quick", "standard", "comprehensive"
  string job_id = 5;
}

message EmotionResponse {
  repeated EmotionSegment segments = 1;
  double overall_confidence = 2;
  double customer_satisfaction_score = 3;
  map<string, double> emotion_distribution = 4;
  string error = 5;
}

message EmotionSegment {
  double start_time = 1;
  double end_time = 2;
  string dominant_emotion = 3;
  double confidence = 4;
  string facial_expression = 5;
  map<string, double> emotion_scores = 6;
  double authenticity_score = 7;
}

// ============================================================================
// Media Enhancement Service
// ============================================================================

service MediaEnhancementService {
  rpc EnhanceMedia(EnhanceRequest) returns (EnhanceResponse);
  rpc BatchEnhanceMedia(BatchEnhanceRequest) returns (BatchEnhanceResponse);
  rpc AdaptiveEnhanceMedia(AdaptiveEnhanceRequest) returns (AdaptiveEnhanceResponse);
}

message EnhanceRequest {
  string testimonial_id = 1;
  string media_url = 2;
  string quality = 3; // "high", "medium", "low"
  bool upload_to_cloud = 4;
  repeated string custom_enhancements = 5;
  string logo_url = 6;
  string watermark_text = 7;
  string watermark_position = 8;
  string brand_color = 9;
  bool add_branding = 10;
  bool remove_noise = 11;
  string job_id = 12;
}

message EnhanceResponse {
  string enhanced_url = 1;
  repeated string applied_enhancements = 2;
  double quality_score = 3;
  string media_type = 4;
  string error = 5;
  double duration = 6;
  double size = 7;
}

message BatchEnhanceRequest {
  repeated MediaOpt options = 1;
  string quality = 2; // "high", "medium", "low"
  bool upload_to_cloud = 3;
  repeated string custom_enhancements = 4;
  string logo_url = 5;
  string watermark_text = 6;
  string watermark_position = 7;
  string brand_color = 8;
  bool add_branding = 9;
  string job_id = 10;
}

message BatchEnhanceResponseOpt {
  string testimonial_id = 1;
  string enhanced_url = 2;
  repeated string applied_enhancements = 3;
  string error = 4;
}

message BatchEnhanceResponse {
  repeated BatchEnhanceResponseOpt response = 1;
}

// Scene-aware Adaptive Enhancement
message AdaptiveEnhanceRequest {
  string testimonial_id = 1;
  string media_url = 2;
  string quality_preset = 3; // "low", "medium", "high", "ultra"
  int32 max_scene_samples = 4; // Max frames to sample for analysis
  double sample_interval = 5; // Interval between samples in seconds
  bool generate_preview = 6; // Generate quick preview instead of full enhancement
  int32 preview_duration = 7; // Preview duration in seconds
  int32 preview_start_time = 8; // Preview start time in seconds
  string job_id = 9;
}

message SceneInfo {
  string scene_type = 1; // "talking_head", "product_demo", "screen_recording", "b_roll", "mixed"
  double start_time = 2;
  double end_time = 3;
  string lighting_quality = 4;
  double avg_brightness = 5;
  double contrast_level = 6;
  string motion_level = 7;
  bool face_detected = 8;
  repeated string recommended_enhancements = 9;
}

message AdaptiveEnhanceResponse {
  string enhanced_url = 1;
  int32 scenes_analyzed = 2;
  repeated string enhancements_applied = 3;
  repeated SceneInfo scene_details = 4;
  string dominant_scene_type = 5;
  double processing_time = 6;
  map<string, double> quality_improvement = 7;
  string error = 8;
}

// ============================================================================
// Narration Service
// ============================================================================

service NarrationService {
  rpc GenerateNarration(NarrationRequest) returns (NarrationResponse);
  rpc BatchGenerateNarration(BatchNarrationRequest) returns (BatchNarrationResponse);
}

message NarrationRequest {
  string testimonial_id = 1;
  string text = 2;
  string language = 3;
  string voice_id = 4; // Optional, fallback to default if not set
  string gender = 5; // Optional
  string style = 6; // Optional
  string prompt = 7; // Optional
  string background_music = 8; // Optional
  string music_volume = 9; // Optional
  bool add_background_music = 10;
  bool optimize_speech = 11;
  string job_id = 12;
}
message NarrationResponse {
  string audio_url = 1;
  double duration = 2;
  string voice_provider = 3;
  double quality_score = 4;
  string processed_text = 5;
  string error = 6;
  double size = 7;
}

message BatchNarrationOpt {
  string testimonial_id = 1;
  string text = 2;
}

message BatchNarrationRequest {
  repeated BatchNarrationOpt options = 1;
  string language = 2;
  string voice_id = 3; // Optional, fallback to default if not set
  string gender = 4; // Optional
  string style = 5; // Optional
  string prompt = 6; // Optional
  string background_music = 7; // Optional
  string music_volume = 8; // Optional
  bool add_background_music = 9;
  bool optimize_speech = 10;
  string job_id = 11;
}

message BatchNarrationResponse {
  repeated NarrationResponse response = 1;
}

// ============================================================================
// Smart Clipping Service
// ============================================================================

service SmartClippingService {
  rpc GenerateClips(ClippingRequest) returns (ClippingResponse);
  rpc BatchGenerateClips(BatchClippingRequest) returns (BatchClippingResponse);
}

message ClippingRequest {
  string testimonial_id = 1;
  string media_url = 2;
  repeated HighlightMoment highlight_moments = 3;
  BrandingOptions branding = 4;
  string background_music = 5; // Optional
  string music_volume = 6; // Optional
  string job_id = 7;
  string session_id = 8; // Session ID for temp storage paths
}

message Word {
  string text = 1;
  double start = 2;
  double end = 3;
  double confidence = 4;
  string speaker = 5;
}

message TranscriptSegment {
  string text = 1;
  double start_time = 2;
  double end_time = 3;
  string speaker = 4;
  repeated Word words = 5;
}

message HighlightMoment {
  string id = 1;
  double start_time = 2;
  double end_time = 3;
  string text = 4;
  string theme = 5;
  repeated Word words = 6; 
  bool social_media_optimize = 7;
  bool enhance_clip = 8;
  bool include_logo = 9;
  bool include_subtitle = 10;
  bool include_watermark = 11;
  string quality = 12; // "high", "medium", "low"
  bool add_background_music = 13;
  bool include_theme = 14;
  bool remove_noise = 15;

  double importance_score = 16;
  string highlight_type = 17;        // "general", "problem", "results", etc.
  string suggested_title = 18;       // Title for video clip
  repeated string keywords = 19;     // Searchable keywords
  double emotional_intensity = 20;  // 0-10 emotional score
  double shareability = 21;         // 0-10 social media potential score
  double engagement_score = 22;
}

message BrandingOptions {
  string logo_url = 1;
  string brand_color = 2;
  string watermark_position = 3;
}

message ClippingResponse {
  repeated Clip clips = 1;
  int32 clips_generated = 2;
  double average_quality = 3;
  string detection_method = 4;
  string error = 5;
}

message Clip {
  string id = 1;
  string url = 2;
  double start_time = 3;
  double end_time = 4;
  string title = 5;
  string text = 6;
  string theme = 7;
  double engagement_score = 8;
  double duration = 9;
  double size = 10;
  map<string, bool> social_media_ready = 11; // platform -> ready status
  string error = 12;
  string highlight_id = 13; // ID of the highlight moment this clip was generated from (for tracking)
}

message ClippingRequestOpt {
  string testimonial_id = 1;
  string media_url = 2;
  repeated HighlightMoment highlight_moments = 3;
}

message BatchClippingRequest {
  repeated ClippingRequestOpt options = 1;
  BrandingOptions branding = 2;
  string background_music = 3; // Optional
  string music_volume = 4; // Optional
  string job_id = 5;
}

message BatchClippingResponse {
  repeated ClippingResponse response = 1;
}

// ============================================================================
// Platform Optimizer Service
// ============================================================================

service PlatformOptimizerService {
  rpc OptimizeMedia(OptimizeRequest) returns (OptimizeResponse);
  rpc BatchOptimizeMedia(BatchOptimizeRequest) returns (BatchOptimizeResponse);

  // IMPROVEMENT #2: Smart Platform Recommendation
  rpc RecommendPlatforms(PlatformRecommendRequest) returns (PlatformRecommendResponse);

  // Step-by-step platform optimization methods
  rpc CropResize(CropResizeRequest) returns (CropResizeResponse);
  rpc BurnCaptions(BurnCaptionsRequest) returns (BurnCaptionsResponse);
  rpc ApplyBranding(ApplyBrandingRequest) returns (ApplyBrandingResponse);
  rpc MixMusic(MixMusicRequest) returns (MixMusicResponse);
  rpc NormalizeAudio(NormalizeAudioRequest) returns (NormalizeAudioResponse);
  rpc EnhanceVideo(EnhanceVideoRequest) returns (EnhanceVideoResponse);
  rpc TextOptimization(TextOptimizationRequest) returns (TextOptimizationResponse);
  rpc ApplyTextOverlay(TextOverlayRequest) returns (TextOverlayResponse);
}

message OptimizeRequest {
  string testimonial_id = 1;
  string media_url = 2;
  string target_platform = 3;
  BrandContext brand_context = 4;
  string transcript = 5;
  string optimization_quality = 6; // "high", "medium", "low"
  bool enable_transitions = 8;
  bool add_branding = 9;
  string background_music = 10; // Optional
  string music_volume = 11; // Optional
  bool enable_captions = 12;
  bool enable_media_enhancement = 13;
  string watermark_text = 14;
  string logo_position = 15;
  string watermark_position = 16;
  repeated TranscriptSegment transcript_segments = 17; 
  bool add_background_music = 18;
  string job_id = 19;
  bool remove_noise = 20;
  bool enable_audio_normalization = 21;
}

message OptimizeOptions {
  string testimonial_id = 1;
  string media_url = 2;
  repeated TestimonialSegment transcript_segments = 3;
}
message BatchOptimizeRequest {
  repeated OptimizeOptions options = 1;
  string target_platform = 2;
  BrandContext brand_context = 3;
  string transcript = 4;
  string optimization_quality = 5; // "high", "medium", "low"
  bool enable_transitions = 7;
  bool add_branding = 8;
  string background_music = 9; // Optional
  string music_volume = 10; // Optional
  bool enable_captions = 11;
  bool enable_media_enhancement = 12;
  string watermark_text = 13;
  string logo_position = 14;
  string watermark_position = 15;
  bool add_background_music = 16;
  string job_id = 17;
}

message OptimizeResponse {
  string optimized_url = 1;
  repeated string applied_optimizations = 2;
  string platform = 3;
  string media_type = 4;
  bool success = 5;
  string error = 6;
  string testimonial_id = 7;
  double duration = 8;
  double size = 9;

}

message BatchOptimizeResponse {
  repeated OptimizeResponse responses = 1;
}

// Step-by-step Platform Optimization Messages

message CropResizeRequest {
  string testimonial_id = 1;
  string media_url = 2;
  string target_platform = 3; // "instagram_feed", "instagram_story", "tiktok", "youtube_shorts", etc.
  string aspect_ratio = 4; // "9:16", "1:1", "16:9", etc.
  string job_id = 5;
  bool upload_intermediate = 6; // true = interactive mode (upload for preview), false = batch mode (no upload)
  bool generate_fast_preview = 7; // true = generate 480p preview first for immediate feedback
}

message CropResizeResponse {
  string cropped_url = 1; // Cloud URL (empty in batch mode)
  string local_path = 2; // Container path for batch mode continuation
  string aspect_ratio = 3;
  double duration = 4;
  double size = 5;
  string error = 6;
}

message CaptionStyleConfig {
  int32 font_size = 1;
  string font_color = 2;
  string background_color = 3;
  string position = 4; // "top", "bottom", "center"
}

message BurnCaptionsRequest {
  string testimonial_id = 1;
  string media_url = 2;
  repeated TranscriptSegment transcript_segments = 3;
  string caption_style = 4; // "modern", "classic", "minimal", etc.
  CaptionStyleConfig style_config = 5; // Optional detailed style configuration
  string target_platform = 6; // Platform-specific caption styling
  string job_id = 7;
  bool upload_intermediate = 8; // true = interactive mode (upload for preview), false = batch mode (no upload)
}

message BurnCaptionsResponse {
  string captioned_url = 1; // Cloud URL (empty in batch mode)
  string local_path = 2; // Container path for batch mode continuation
  int32 captions_added = 3;
  string caption_style = 4;
  double duration = 5;
  double size = 6;
  string error = 7;
}

message ApplyBrandingRequest {
  string testimonial_id = 1;
  string media_url = 2;
  BrandingOptions branding = 3; // Logo and watermark options
  string logo_position = 4; // "top-left", "top-right", "bottom-left", "bottom-right"
  double logo_scale = 5;
  string logo_url = 6; // Direct logo URL - used by ai-service
  string watermark_url = 7; // Direct watermark URL - used by ai-service (DEPRECATED - use watermark_text instead)
  BrandingConfig branding_config = 8; // Detailed config used by ai-service
  string job_id = 9;
  bool upload_intermediate = 10; // true = interactive mode (upload for preview), false = batch mode (no upload)
  string watermark_text = 11; // Text to overlay as watermark (typically workspace name)
  string watermark_position = 12; // Position for watermark text
  string brand_color = 13; // Brand color for watermark
}

message BrandingConfig {
  string logo_position = 1; // "top_right", "top_left", "bottom_right", "bottom_left"
  double logo_opacity = 2; // 0.0 - 1.0
  string logo_size = 3; // "small", "medium", "large"
  string watermark_position = 4; // "top_right", "bottom_right", etc.
  double watermark_opacity = 5; // 0.0 - 1.0
}

message ApplyBrandingResponse {
  string branded_url = 1; // Cloud URL (empty in batch mode)
  string local_path = 2; // Container path for batch mode continuation
  repeated string applied_elements = 3; // ["logo", "watermark", "color_grading"]
  double duration = 4;
  double size = 5;
  string error = 6;
}

message MixMusicRequest {
  string testimonial_id = 1;
  string media_url = 2;
  string music_track = 3; // URL or preset name
  string music_volume = 4; // "low", "medium", "high" or percentage
  double fade_in_duration = 5;
  double fade_out_duration = 6;
  string job_id = 7;
  bool upload_intermediate = 8; // true = interactive mode (upload for preview), false = batch mode (no upload)
}

message MixMusicResponse {
  string music_mixed_url = 1; // Cloud URL (empty in batch mode) - matches ai-service response field
  string local_path = 2; // Container path for batch mode continuation
  string music_track = 3;
  double duration = 4;
  double size = 5;
  string error = 6;
}

message TextOptimizationRequest {
  string testimonial_id = 1;
  string transcript = 2;
  string target_platform = 3;
  BrandContext brand_context = 4;
  string optimization_goal = 5; // "engagement", "clarity", "brevity"
  string job_id = 6;
}

message TextOptimizationResponse {
  string optimized_text = 1;
  repeated string improvements = 2; // ["removed_filler_words", "improved_clarity", "added_keywords"]
  double readability_score = 3;
  string error = 4;
}

message TextOverlayRequest {
  string job_id = 1;
  string testimonial_id = 2;
  string media_url = 3;
  bool upload_intermediate = 4; // true = upload for preview, false = batch mode
  TextOverlayConfig config = 5;
}

message TextOverlayConfig {
  // Intro animation settings (brand and speaker introduction)
  bool enable_intro = 1;
  string workspace_name = 2;         // Brand/workspace name to display
  string speaker_name = 3;           // Speaker's full name
  string role = 4;                   // Speaker's role/title
  string location = 5;               // Speaker's location
  double intro_duration = 6;         // Duration in seconds (default: 4.0, max: 30% of video)

  // Outro animation settings (brand tagline and sign-off)
  bool enable_outro = 7;
  string tagline = 8;                // Brand tagline or call-to-action
  double outro_duration = 9;         // Duration in seconds (default: 6.0, max: 30% of video)

  // Styling settings
  string brand_color = 10;           // Hex color code (e.g., "#FF5733")
  string animation_style = 11;       // "elegant", "slide", "fade", "pop" (default: "elegant")
  string font_family = 12;           // Font to use (default: "DejaVu-Sans-Bold")

  // Advanced settings
  double fade_duration = 13;         // Fade transition duration (default: 0.5s)
  string background_overlay = 14;    // Optional background overlay color with opacity
}

message TextOverlayResponse {
  string overlaid_url = 1;           // Cloud URL (empty in batch mode)
  string local_path = 2;             // Container path for batch mode continuation
  bool intro_applied = 3;            // Whether intro animation was applied
  bool outro_applied = 4;            // Whether outro animation was applied
  double duration = 5;
  double size = 6;
  int32 width = 7;                   // Video width in pixels
  int32 height = 8;                  // Video height in pixels
  string error = 9;
}

message NormalizeAudioRequest {
  string testimonial_id = 1;
  string media_url = 2;
  string target_platform = 3;
  double target_loudness = 4; // LUFS target (-14 for streaming, -16 for broadcast)
  string job_id = 5;
  bool upload_intermediate = 6; // Usually false - processing step only
}

message NormalizeAudioResponse {
  string normalized_url = 1; // Cloud URL (usually empty - processing step)
  string local_path = 2; // Container path for continuation
  double achieved_loudness = 3; // Actual LUFS achieved
  bool normalization_applied = 4;
  double duration = 5;
  double size = 6;
  string error = 7;
}

message EnhanceVideoRequest {
  string testimonial_id = 1;
  string media_url = 2;
  string target_platform = 3;
  string enhancement_level = 4; // "standard", "high", "premium" - matches ai-service field name
  string job_id = 5;
  bool upload_intermediate = 6; // true = final preview, false = batch mode
}

message EnhanceVideoResponse {
  string enhanced_url = 1; // Cloud URL (empty in batch mode)
  string local_path = 2; // Container path for batch mode continuation
  repeated string applied_enhancements = 3; // ["platform_colors", "engagement_hook", "quality_boost"]
  double quality_score = 4;
  double duration = 5;
  double size = 6;
  string error = 7;
}

// IMPROVEMENT #2: Smart Platform Recommendation Messages

message PlatformRecommendRequest {
  string testimonial_id = 1;
  string media_url = 2;
  string transcript = 3;
  google.protobuf.Struct sentiment_data = 4; // Sentiment analysis results
  string industry = 5; // Business industry/niche
  string current_aspect_ratio = 6; // Current video aspect ratio (e.g., "16:9")
  double file_size_mb = 7; // Current file size in MB
  double duration = 8; // Video duration in seconds
}

message PlatformRecommendation {
  string platform = 1;
  double score = 2; // 0.0 to 1.0
  string confidence = 3; // "high", "medium", "low"
  string recommended_aspect_ratio = 4;
  repeated string reasons = 5; // Why this platform is recommended
  repeated string optimization_tips = 6; // Platform-specific tips
  string estimated_engagement = 7; // "very_high", "high", "medium", "low"
}

message PlatformRecommendResponse {
  PlatformRecommendation primary_recommendation = 1;
  repeated PlatformRecommendation alternative_platforms = 2;
  repeated AvoidPlatform avoid_platforms = 3;
  google.protobuf.Struct content_analysis = 4;
  string error = 5;
}

message AvoidPlatform {
  string platform = 1;
  string reason = 2;
}


// ============================================================================
// Thumbnail Service
// ============================================================================

service ThumbnailService {
  rpc SelectThumbnails (ThumbnailRequest) returns (ThumbnailResponse);
}

message ThumbnailRequest {
  string testimonial_id = 1;
  string media_url = 2;
  int32 max_thumbnails = 3;
  string job_id = 4;
}

message ThumbnailResponse {
  repeated string thumbnail_urls = 1;
}


// ============================================================================
// StoryMode Service
// ============================================================================

service StoryModeService {
  rpc GenerateStoryVideo (StoryModeRequest) returns (StoryModeResponse);
  rpc BatchGenerateStoryVideos (BatchStoryModeRequest) returns (BatchStoryModeResponse);

  // Step-by-step story video methods (3-step workflow)
  rpc CollectClips(CollectClipsRequest) returns (CollectClipsResponse);
  rpc AIOrdering(AIOrderingRequest) returns (AIOrderingResponse);
  rpc AssembleDraft(AssembleDraftRequest) returns (AssembleDraftResponse);
  rpc CollectAndAssembleClips(CollectAndAssembleClipsRequest) returns (AssembleDraftResponse);

  // B-roll and stock footage integration
  rpc ApplyBrollOverlays(BrollOverlayRequest) returns (BrollOverlayResponse);
  rpc SearchStockFootage(StockFootageSearchRequest) returns (StockFootageSearchResponse);

  // IMPROVEMENT #3: Intelligent Hook Detection
  rpc DetectHooks(HookDetectionRequest) returns (HookDetectionResponse);

  // Legacy/optional step-by-step methods
  rpc NormalizeVideoResolution(NormalizeVideoRequest) returns (NormalizeVideoResponse);
  rpc AssembleStoryVideo(AssembleStoryRequest) returns (AssembleStoryResponse);
  rpc AddIntroOutro(IntroOutroRequest) returns (IntroOutroResponse);
}

message TestimonialSegment {
  string testimonial_id = 1;
  string media_url = 2;
  repeated HighlightMoment highlights = 3;
}

message ProcessedSegment {
  string media_url = 1;
  double start_time = 2;
  double end_time = 3;
  double duration = 4;
  string text_content = 5;
  string theme = 6;
  google.protobuf.Struct metadata = 10;
  string testimonial_id = 11;
}

message StoryModeRequest {
  repeated TestimonialSegment testimonial_segments = 1;
  repeated ProcessedSegment processed_segments = 2;
  BrandContext brand_context = 3;
  string output_format = 4;
  string background_music = 5;
  string music_volume = 6;
  string prompt = 7;
  string intro_image_url = 8;
  string outro_image_url = 9;
  string company_name = 10;
  bool add_background_music = 11;
  string job_id = 12;
  string type = 13;
  bool auto_order = 14;
}


message BatchStoryModeOptions {
  repeated TestimonialSegment opt = 1;
}


message BatchStoryModeRequest {
  repeated BatchStoryModeOptions testimonial_segments = 1;
  BrandContext brand_context = 2;
  string output_format = 3;
  string background_music = 4;
  string music_volume = 5;
  string prompt = 6;
  string intro_image_url = 7;
  string outro_image_url = 8;
  string company_name = 9;
  bool add_background_music = 10;
  string job_id = 11;
}

message StoryModeResponse {
  string story_video_url = 1;
  double duration = 2;
  double size = 3;
}

message BatchStoryModeResponse {
  repeated string story_video_urls = 1;
}

// Step-by-step Story Video Messages (3-step workflow)

message CollectClipsRequest {
  string session_id = 1;
  string workspace_id = 3;
  string job_id = 5;
  bool upload_intermediate = 6; // true = upload clips to cloud for preview, false = keep local only

  // Option 1: Extract new clips from testimonials (API-server fetches highlights first)
  repeated TestimonialSegment testimonial_segments = 2; // Testimonials with highlights to extract

  // Option 2: Use already-extracted clips (API-server fetches clip metadata first)
  repeated ClipInfo existing_clips = 7; // Already-extracted clips with metadata

  // Note: Can use both options together (combine existing clips + extract new ones)
}

message ClipInfo {
  string clip_id = 1;
  string testimonial_id = 2;
  string storage_path = 3; // Cloud storage path if uploaded, local path otherwise
  string preview_url = 4; // Presigned URL for frontend preview
  double start_time = 5;
  double end_time = 6;
  double duration = 7;
  string highlight_type = 8;
  string text_content = 9; // Transcript excerpt for this clip
  google.protobuf.Struct metadata = 10;
}

message CollectClipsResponse {
  repeated ClipInfo clips = 1;
  int32 total_clips = 2;
  double total_duration = 3;
  string error = 4;
}

message AIOrderingRequest {
  string session_id = 1;
  repeated ClipInfo clips = 2; // Clips from CollectClips step
  string ordering_strategy = 3; // "narrative", "emotional_arc", "chronological", "impact"
  string brand_context = 4; // Optional brand/company context for ordering
  string job_id = 5;
}

message AIOrderingResponse {
  repeated ClipInfo ordered_clips = 1; // Same clips but reordered
  string ordering_rationale = 2; // AI explanation of why this order makes sense
  double confidence_score = 3; // 0.0-1.0 confidence in ordering quality
  string error = 4;
  repeated int32 semantic_gaps = 5; // AI-detected semantic gaps for context card insertion
}

message AssembleDraftRequest {
  string session_id = 1;
  string testimonial_id = 2; // Primary testimonial ID for tracking
  repeated ClipInfo clips = 3; // Clips in desired order (from AIOrdering or manual)
  string transition_type = 4; // "fade", "dissolve", "wipe", "slideright", "slidedown", "none"
  double transition_duration = 5; // Duration in seconds
  string job_id = 6;
  bool upload_intermediate = 7; // true = upload assembled video for preview
  repeated int32 semantic_gaps = 8; // Indices where semantic gaps exist between consecutive clips (for context cards)
}

message CollectAndAssembleClipsRequest {
  string session_id = 1;
  string workspace_id = 3;
  string job_id = 5;
  bool upload_intermediate = 6; // true = upload clips to cloud for preview, false = keep local only
  repeated TestimonialSegment testimonial_segments = 2; // Testimonials with highlights to extract
  // Option 2: Use already-extracted clips (API-server fetches clip metadata first)
  repeated ClipInfo existing_clips = 7; // Already-extracted clips with metadata
  double transition_duration = 8; // Duration in seconds
  string transition_type = 9; // "fade", "dissolve", "wipe", "slideright", "slidedown", "none"
  repeated int32 semantic_gaps = 10; // Indices where semantic gaps exist between consecutive clips (for context cards)
}

message AssembleDraftResponse {
  string assembled_url = 1; // Cloud URL if upload_intermediate=true
  string local_path = 2; // Local container path
  double duration = 3;
  double size = 4; // File size in MB
  int32 clips_assembled = 5;
  string error = 6;
  int32 width = 7; // Video width in pixels
  int32 height = 8; // Video height in pixels
  string aspect_ratio = 9; // Aspect ratio as string (e.g. "16:9", "9:16", "1:1")
}

// B-roll Overlay Messages

message BrollOverlayRequest {
  string job_id = 1;
  string testimonial_id = 2;
  string media_url = 3;                 // Main testimonial video
  repeated BrollClip broll_clips = 4;   // B-roll clips to overlay
  BrollConfig config = 5;               // Configuration for overlays
  bool upload_intermediate = 6;         // true = upload for preview, false = batch mode
  repeated TranscriptSegment transcript_segments = 7; // Transcript segments for AI placement
}

message BrollClip {
  string clip_id = 1;                   // Unique ID for this B-roll clip
  string source_url = 2;                // URL or local path to B-roll media
  double start_time = 3;                // When to start overlay in main video (seconds)
  double duration = 4;                  // How long to show B-roll (seconds)
  string position_mode = 5;             // "fill", "pip", "split" (default: "fill")
  string transition_type = 6;           // "fade", "dissolve", "wipe", "none" (default: "fade")
  double transition_duration = 7;       // Transition duration in seconds (default: 0.5)

  // Position settings for "pip" mode
  string pip_position = 8;              // "top_left", "top_right", "bottom_left", "bottom_right"
  double pip_scale = 9;                 // Scale factor for PIP (0.2-0.5, default: 0.3)

  // Split mode settings
  string split_orientation = 10;        // "horizontal", "vertical" (default: "vertical")

  // Metadata
  string source_type = 11;              // "stock", "uploaded", "generated"
  string search_query = 12;             // Original search query if from stock footage
  repeated string keywords = 13;        // Keywords associated with this clip
}

message BrollConfig {
  string placement_strategy = 1;        // "auto" = AI placement, "custom" = manual placement
  bool preserve_audio = 2;              // true = keep original audio, false = mute during B-roll
  double audio_ducking = 3;             // Reduce main audio by this amount (0.0-1.0, default: 0.3)
  string default_transition = 4;        // Default transition if not specified per clip
  double default_transition_duration = 5; // Default transition duration
  string quality_preset = 6;            // "high", "medium", "low" (default: "high")
  bool auto_adjust_timing = 7;          // Auto-adjust B-roll timing to avoid covering speaker's face
  double max_broll_duration = 8;        // Maximum duration for individual B-roll clips (default: 10.0)
  double max_broll_percent = 9;         // Maximum percentage of video that can be B-roll (default: 0.3)
  string position_mode = 10;            // Default position mode for clips (default: "fill")
  string transition_type = 11;          // Default transition type (default: "fade")
}

message BrollOverlayResponse {
  string overlaid_url = 1;              // Cloud URL (empty in batch mode)
  string local_path = 2;                // Container path for batch mode continuation
  int32 brolls_applied = 3;             // Number of B-roll clips successfully applied
  repeated string failed_clips = 4;     // IDs of clips that failed to apply
  double duration = 5;
  double size = 6;
  int32 width = 7;
  int32 height = 8;
  string error = 9;
  string aspect_ratio = 10;             // Aspect ratio (e.g., "9:16", "16:9", "1:1")
}

// Stock Footage Search Messages

message StockFootageSearchRequest {
  string query = 1;                     // Search query (keywords)
  string provider = 2;                  // "pexels", "pixabay", "both" (default: "both")
  int32 max_results = 3;                // Maximum results per provider (default: 10)
  string orientation = 4;               // "landscape", "portrait", "square", "all" (default: "all")
  int32 min_duration = 5;               // Minimum video duration in seconds
  int32 max_duration = 6;               // Maximum video duration in seconds
  string job_id = 7;                    // Job ID for tracking
}

message StockFootageItem {
  string id = 1;                        // Unique ID from provider
  string provider = 2;                  // "pexels" or "pixabay"
  string preview_url = 3;               // URL to preview/thumbnail
  string video_url = 4;                 // URL to download video (HD quality)
  string video_url_sd = 5;              // URL to download video (SD quality)
  int32 width = 6;                      // Video width in pixels
  int32 height = 7;                     // Video height in pixels
  double duration = 8;                  // Duration in seconds
  string photographer = 9;              // Creator/photographer name
  string photographer_url = 10;         // Link to creator's profile
  repeated string tags = 11;            // Tags/keywords for this footage
  double relevance_score = 12;          // AI-computed relevance score (0.0-1.0)
}

message StockFootageSearchResponse {
  repeated StockFootageItem results = 1; // Search results
  int32 total_results = 2;              // Total results found
  string query = 3;                     // Original query
  double search_time = 4;               // Time taken for search in seconds
  string error = 5;
}

// Legacy step-by-step messages

message AssembleStoryRequest {
  string testimonial_id = 1; // Testimonial ID for tracking
  repeated string clip_paths = 2; // Local or cloud paths to clips
  string transition_type = 3; // "fade", "slide", "zoom", "none"
  double transition_duration = 4; // Duration in seconds
  string job_id = 5;
  bool upload_intermediate = 6; // true = interactive mode (upload for preview), false = batch mode (no upload)
}

message AssembleStoryResponse {
  string video_url = 1; // Cloud URL (empty in batch mode)
  string local_path = 2; // Container path for batch mode continuation
  double duration = 3;
  double size = 4;
  int32 clips_assembled = 5;
  string error = 6;
}

message IntroOutroRequest {
  string testimonial_id = 1; // Testimonial ID for tracking
  string media_url = 2;
  bool add_intro = 3; // true = add intro, false = skip intro
  bool add_outro = 4; // true = add outro, false = skip outro
  string job_id = 5;
  bool upload_intermediate = 6; // true = interactive mode (upload for preview), false = batch mode (no upload)

  // Custom text for intro/outro (both displayed and spoken)
  // Frontend should construct these with company name from workspace
  // Example: "Welcome. Thank you for choosing {company_name}. Here's what our customers have to say."
  string intro_text = 11; // Optional custom intro text (if empty, uses default)
  string outro_text = 12; // Optional custom outro text (if empty, uses default)

  // Brand context for logo, colors, etc.
  BrandContext brand_context = 13;
  string workspace_name = 14; // Workspace name (used as brand name in voiceover)

}

message IntroOutroResponse {
  string output_url = 1; // Cloud URL (empty in batch mode) - matches ai-service response field
  string local_path = 2; // Container path for batch mode continuation
  double duration = 3;
  double size = 4;
  string error = 5;
  int32 width = 6; // Video width in pixels
  int32 height = 7; // Video height in pixels
  string aspect_ratio = 8; // Aspect ratio as string (e.g. "16:9", "9:16", "1:1")
}

// Hook Detection (IMPROVEMENT #3)
message HookDetectionRequest {
  string testimonial_id = 1;
  string transcript = 2;
  repeated TranscriptSegment transcript_segments = 3;
  google.protobuf.Struct sentiment_data = 4;
  double duration = 5;
  string target_platform = 6; // Optional: optimize for specific platform
  string target_position = 7; // Optional: "intro", "first_3_seconds", etc.
  double max_duration = 8; // Optional: max hook duration in seconds
  string job_id = 9;
}

message HookCandidate {
  double start_time = 1;
  double end_time = 2;
  string text = 3;
  string hook_type = 4; // "question", "surprise", "emotional", "statistic", "benefit", "problem"
  double engagement_score = 5; // 0-10
  string placement_recommendation = 6; // "intro", "first_3_seconds", "early", "middle", "closing"
  string reasoning = 7;
  repeated string keywords = 8;
  HookCutTiming cut_timing = 9; // Recommended timing for extracting this hook
}

message HookCutTiming {
  double start_time = 1; // Including pre-roll
  double end_time = 2; // Including post-roll
  double original_start = 3; // Original hook start
  double original_end = 4; // Original hook end
}

message HookDetectionResponse {
  repeated HookCandidate hooks = 1;
  HookCandidate best_hook = 2; // Single best recommendation
  int32 hooks_detected = 3;
  string error = 4;
}

message NormalizeVideoRequest {
  string testimonial_id = 1; // Testimonial ID for tracking
  repeated string clip_urls = 2; // Multiple clips to normalize to same resolution
  string target_resolution = 3; // "1080p", "720p", "auto" (picks highest common)
  string job_id = 4;
  bool upload_intermediate = 5; // Usually false - processing step only
}

message NormalizeVideoResponse {
  repeated string normalized_urls = 1; // Cloud URLs (usually empty - processing step)
  repeated string local_paths = 2; // Container paths for continuation
  double duration = 3; // Total duration
  double size = 4; // Total file size
  string error = 5;
}


// ============================================================================
// Noise Reducer
// ============================================================================

service NoiseReducerService {
  rpc ReduceNoise(NoiseReductionRequest) returns (NoiseReductionResponse);
  rpc BatchReduceNoise(BatchNoiseReductionRequest) returns (BatchNoiseReductionResponse);
}

message NoiseReductionRequest {
  string testimonial_id = 1;
  string media_url = 2;
  string level = 3;
  string job_id= 4;
}

message NoiseReductionResponse {
  string testimonial_id = 1;
  string denoised_media_url = 2;
  string error = 3;
}

message BatchNoiseReductionRequest {
  repeated MediaOpt options = 1;
  string level = 2;
  string job_id = 3;
}


message BatchNoiseReductionResponse {
  repeated NoiseReductionResponse response = 1;
}

// ============================================================================
// Viral Content Analysis Service
// ============================================================================

service ViralAnalysisService {
  rpc AnalyzeViralPotential(ViralAnalysisRequest) returns (ViralAnalysisResponse);
  rpc BatchAnalyzeViralPotential(BatchViralAnalysisRequest) returns (BatchViralAnalysisResponse);
}

message ViralAnalysisRequest {
  string testimonial_id = 1;
  string media_url = 2;
  string transcript = 3;
  BrandContext brand_context = 4;
  repeated string target_platforms = 5;
  string job_id = 6;
}

message ViralMoment {
  double start_time = 1;
  double end_time = 2;
  double viral_score = 3;
  repeated string reasons = 4;
  repeated string recommended_platforms = 5;
  double thumbnail_timestamp = 6;
  string suggested_caption = 7;
  repeated string trending_elements = 8;
}

message ThumbnailOption {
  double timestamp = 1;
  double viral_score = 2;
  string recommended_text = 3;
  repeated string platforms = 4;
  string reason = 5;
}

message ViralAnalysisResponse {
  bool success = 1;
  double overall_viral_score = 2;
  repeated ViralMoment viral_moments = 3;
  repeated ThumbnailOption best_thumbnail_options = 4;
  repeated string trending_keywords = 5;
  map<string, double> platform_recommendations = 6;
  repeated string optimization_suggestions = 7;
  string error = 8;
  double processing_time = 9;
  string testimonial_id = 10;
}

message BatchViralAnalysisRequest {
  repeated ViralAnalysisRequest requests = 1;
}

message BatchViralAnalysisResponse {
  repeated ViralAnalysisResponse responses = 1;
}

// ============================================================================
// Session Management Service (for interactive step-by-step processing)
// ============================================================================

service SessionManagementService {
  rpc SaveProgress(SaveProgressRequest) returns (SaveProgressResponse);
  rpc CleanupSession(CleanupSessionRequest) returns (CleanupSessionResponse);
}

message SaveProgressRequest {
  string job_id = 1;
  string testimonial_id = 2;
}

message SaveProgressResponse {
  string saved_url = 1; // Final uploaded URL
  repeated string steps_completed = 2;
  double duration = 3;
  double size = 4;
  string error = 5;
}

message CleanupSessionRequest {
  string job_id = 1;
}

message CleanupSessionResponse {
  bool success = 1;
  string error = 2;
}
