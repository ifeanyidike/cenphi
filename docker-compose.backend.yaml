# docker-compose.backend.yaml - Backend services only
services:
  api-server:
    build:
      context: ./api-server
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - ./api-server/.env
    volumes:
      - ./api-server:/src
      - ~/.aws:/root/.aws:ro
      # - ~/.ssh:/app/oci-secrets  # Commented out if not needed
    environment:
      - OCI_GO_SDK_DEBUG=info
      - DB_USERNAME=cenphi_user
      - DB_PASSWORD=cenphi_password
      - DB_HOST=cenphidb
      - DB_PORT=5432
      - DB_NAME=cenphidb
      - DB_SSL_MODE=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redispassword
    depends_on:
      cenphidb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "if [ -f /app/oci-secrets/private_rsa ]; then 
               chmod 600 /app/oci-secrets/private_rsa && 
               echo 'OCI key permissions set'; 
             else 
               echo 'OCI key not found, continuing without it'; 
             fi && 
             echo 'Starting server...' && 
             OCI_GO_SDK_DEBUG=info air -c .air.toml"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.cloudrun
    ports:
      - "8080:8080"
    env_file:
      - ./ai-service/.env
    volumes:
      - ai-model-cache:/models
      - ./ai-service/storage:/app/storage
      - ./ai-service/logs:/app/logs
      - ~/.ssh:/app/oci-secrets
      - ./ai-service/src:/app/src
      - ai-service-venv:/app/.venv
      - ./ai-service/main.py:/app/main.py:ro
      - ./ai-service/intelligence_pb2.py:/app/intelligence_pb2.py:ro
      - ./ai-service/intelligence_pb2_grpc.py:/app/intelligence_pb2_grpc.py:ro
    deploy:
      resources:
        limits:
          memory: 6G
          cpus: "4"
        reservations:
          memory: 2G
          cpus: "2"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864
    environment:
      - USE_RUNPOD=false
      - RUNPOD_ENDPOINT=${RUNPOD_ENDPOINT:-http://localhost:8000}
      - RUNPOD_API_KEY=${RUNPOD_API_KEY:-}

  redis:
    image: redis:7.2-alpine
    container_name: cenphi_redis
    ports:
      - "6379:6379"
    command: >
      redis-server 
      --requirepass redispassword 
      --appendonly yes 
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redispassword", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  cenphidb:
    image: postgres:15-alpine
    container_name: cenphi_postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: "cenphi_user"
      POSTGRES_PASSWORD: "cenphi_password"
      POSTGRES_DB: "cenphidb"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./init_test_db.sql:/docker-entrypoint-initdb.d/init_test_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cenphi_user -d cenphidb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  dbdata:
    name: cenphi_dbdata
  ai-model-cache:
    name: cenphi_ai_models
    driver: local
  ai-storage:
    name: cenphi_ai_storage
  redis-data:
    name: cenphi_redis_data
  ai-service-venv:
