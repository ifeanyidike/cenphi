root = "."
testdata_dir = "testdata"
tmp_dir = "bin"

[build]
  bin = "./bin/main"
  cmd = "go build -o ./bin/main ./cmd"
  delay = 1000
  exclude_dir = ["assets", "bin", "vendor", "testdata", "web", "docs", "scripts", "node_modules", ".git"]
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  include_ext = ["go"]
  kill_delay = "1s"
  log = "build-errors.log"
  poll = true            # <-- switch to polling (reliable)
  poll_interval = 500    # <-- check every 500ms
  rerun = true
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = false
