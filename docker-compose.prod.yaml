# docker-compose.prod.yaml
# Production configuration - API Server only (Redis on separate instance)

version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cenphi_frontend
    restart: always
    volumes:
      - ./frontend:/usr/src/app
    depends_on:
      - api-server
    ports:
      - "3300:80"
    command: ["nginx", "-g", "daemon off;"]

  api-server:
    image: lorddickson/api-server:latest
    container_name: cenphi_api_server
    restart: always
    ports:
      - "8081:8081"
    volumes:
      - ./api-server/.env:/app/.env
      - ~/.aws:/root/.aws:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
    environment:
      - GO_ENV=production
      - SERVER_ADDRESS=:8081
    command: ["/app/api"]
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://localhost:8081/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Database service
  cenphidb:
    image: postgres:latest
    container_name: cenphi_postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: "${DB_USERNAME}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "cenphidb"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./init_test_db.sql:/docker-entrypoint-initdb.d/init_test_db.sql

volumes:
  dbdata:
    name: cenphi_dbdata
